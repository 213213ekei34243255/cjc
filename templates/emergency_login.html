<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <title>Sign in - Emergency Dashboard</title>
    <style nonce="{{ csp_nonce }}">
        :root { color-scheme: light; }
        * { box-sizing: border-box; }
        body {
            margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
            background: #13153A; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        .card {
            background: #fff; border-radius: 20px; padding: 32px 28px; width: 100%; max-width: 340px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.35);
        }
        h1 { font-size: 20px; margin: 0 0 4px; color: #1E2153; }
        p.sub { margin: 0 0 20px; color: #7A78A3; font-size: 13px; }
        input {
            width: 100%; padding: 12px 14px; border-radius: 12px; border: 1px solid #E0DFF0;
            font-size: 15px; margin-bottom: 14px;
        }
        button {
            width: 100%; padding: 12px; border: none; border-radius: 999px; background: #D64545;
            color: #fff; font-weight: 600; font-size: 14px; cursor: pointer;
        }
        button:hover { background: #b93838; }
        .error { color: #D6304B; font-size: 13px; margin: -6px 0 14px; }
    </style>
</head>
<body>
    <form class="card" method="post" action="{{ login_url }}" autocomplete="off">
        <h1>🚨 Emergency Dashboard</h1>
        <p class="sub">Private. Every view of emergency data is logged.</p>
        {% if error %}<div class="error">{{ error }}</div>{% endif %}
        <input type="password" name="password" placeholder="Password" autofocus required>
        <button type="submit">Sign in</button>
    </form>
</body>
</html>
